name: Pre-build assets

# The release commit semantic-release pushes to version-16 (on_release.yml) is also
# advertised in frappe/marketplace as the stable release, once its assets exist.

on:
  push:
    branches: [develop, version-16]

# Release PRs edit the same marketplace entry, so run one at a time per branch.
concurrency:
  group: assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assets:
    name: Pre-build assets
    uses: frappe/pilot/.github/workflows/app-assets.yml@develop
    with:
      # Pilot benches run Frappe v16 or later, so version-15 is not built.
      frappe-branch: ${{ github.ref_name == 'version-16' && 'version-16' || 'develop' }}
    permissions:
      contents: write

  marketplace:
    name: Open the marketplace release PR
    needs: assets
    if: >-
      github.ref_name == 'version-16' &&
      startsWith(github.event.head_commit.message, 'chore(release):')
    uses: frappe/marketplace/.github/workflows/publish-release.yml@main
    with:
      app: helpdesk
      branch: ${{ github.ref_name }}
      commit: ${{ github.sha }}
      channel: stable
    secrets:
      registry_token: ${{ secrets.MARKETPLACE_PR_TOKEN }}
