name: UI Tests

on:
  pull_request:
    branches:
      - develop
    paths:
      - "desk/**"
      - "shared/**"
      - "studio/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/ui-tests.yml"
  workflow_dispatch:

concurrency:
  group: ui-tests-helpdesk-${{ github.event.number || github.ref }}
  cancel-in-progress: true

env:
  FRAPPE_BRANCH: develop
  SITE: helpdesk.test

jobs:
  ui-tests:
    name: Playwright E2E Tests (${{ matrix.shard }}/2)
    runs-on: frappe-arc
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Install Yarn
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Cache pip and uv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-ui-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-ui-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('yarn.lock') }}

      - name: Setup Pilot
        run: |
          export UV_PYTHON=3.14
          curl -fsSL https://raw.githubusercontent.com/frappe/pilot/develop/install.sh | sh -s -- --ci
          export PATH="$HOME/pilot/bin:$HOME/.local/bin:$PATH"
          printf '%s\n' "$HOME/pilot/bin" "$HOME/.local/bin" >> "$GITHUB_PATH"
          pilot new frappe-bench --frappe-branch "$FRAPPE_BRANCH"
          pilot -b frappe-bench set-bench-config python "3.14"
          pilot -b frappe-bench set-bench-config admin_allow_site_to_pilot_communication false
          pilot -b frappe-bench set-bench-config watch_apps_js false
          pilot -b frappe-bench set-bench-config reload_python false
          pilot -b frappe-bench set-bench-config lite_mode_enabled false
          pilot -b frappe-bench set-bench-config mariadb_existing true
          pilot -b frappe-bench set-bench-config mariadb_host 127.0.0.1
          pilot -b frappe-bench set-bench-config mariadb_port 3306
          pilot -b frappe-bench set-bench-config mariadb_admin_user root
          pilot -b frappe-bench set-bench-config mariadb_password root
          pilot -b frappe-bench init
          # Ubuntu 26.04's mariadb-client (11.8) requires SSL; container MariaDB has none.
          printf '[client]\nskip-ssl\n' > ~/.my.cnf
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install Helpdesk
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: |
          uv pip install --python env/bin/python -e "apps/frappe[test]"
          pilot get-app https://github.com/frappe/telephony --skip-assets
          pilot get-app "$GITHUB_WORKSPACE" --branch "$GITHUB_SHA" --skip-assets
        env:
          CI: "Yes"

      - name: Start Pilot
        run: |
          pilot -b frappe-bench start > "$RUNNER_TEMP/pilot.log" 2>&1 &
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:7000/api/v1/health

      - name: Create and Build Site
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: |
          pilot new-site "$SITE" --admin-password admin --apps frappe telephony helpdesk --skip-assets
          pilot build --apps frappe
          # Never prebuilt: e2e must exercise this checkout's frontend, not a download.
          pilot build --apps helpdesk --force
        env:
          CI: "Yes"

      - name: Configure Site for UI Tests
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: |
          pilot frappe --site "$SITE" set-config allow_tests true
          pilot frappe --site "$SITE" set-config host_name "http://localhost:8000"
          # The suite creates more users in an hour than the default limit (60) allows.
          pilot frappe --site "$SITE" set-config -p throttle_user_limit 10000
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors \
            --output /dev/null -H "X-Frappe-Site-Name: $SITE" "http://localhost:8000/api/method/ping"

      - name: Install Playwright
        run: |
          yarn install --frozen-lockfile --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: npx playwright test --shard=${{ matrix.shard }}/2
        env:
          # localhost is a secure context, which crypto.randomUUID in frappe/ui needs.
          BASE_URL: http://localhost:8000
          SITE_NAME: ${{ env.SITE }}
          ADMIN_PASSWORD: admin

      - name: Upload Blob Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

      - name: Show Pilot Logs on Failure
        if: failure()
        run: |
          cat "$RUNNER_TEMP/pilot.log" || true
          cat ~/pilot/benches/frappe-bench/logs/*.log || true

  merge-reports:
    name: Merge Playwright Reports
    needs: ui-tests
    if: always()
    runs-on: frappe-arc

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Yarn
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Install Playwright
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Download Blob Reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge Into HTML Report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
