name: Server

on:
  pull_request:
    branches:
      - main
      - main-hotfix
      - develop

    paths-ignore:
      - '**.js'
      - '**.css'
      - '**.md'
      - '**.html'
      - '**.csv'
  workflow_dispatch:

concurrency:
  group: develop-helpdesk-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python Unit Tests
    runs-on: frappe-arc
    timeout-minutes: 60

    services:
        mysql:
          image: mariadb:11.8
          env:
            MARIADB_ROOT_PASSWORD: 'root'
          ports:
            - 3306:3306
          options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Check for valid Python & Merge Conflicts
        if: github.event.pull_request.base.ref == 'develop'
        run: |
          python3 -m compileall -f "${GITHUB_WORKSPACE}"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}"
            then echo "Found merge conflicts"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Add to Hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Cache pip and uv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install
        run: bash ${GITHUB_WORKSPACE}/.github/helpers/install.sh
        env:
          CI: "Yes"
          TYPE: server
          FRAPPE_BRANCH: ${{ github.event.inputs.branch }}

      - name: Run Tests
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: pilot frappe --site test_site run-tests --app helpdesk --coverage
        env:
          TYPE: server
          CI_BUILD_ID: ${{ github.run_id }}

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.container }}
          path: /home/runner/pilot/benches/frappe-bench/sites/coverage.xml

      - name: Show Pilot logs on failure
        if: failure()
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: |
          cat "$RUNNER_TEMP/pilot.log" || true
          cat logs/*.log || true

  coverage:
    name: Coverage Wrap Up
    needs: tests
    runs-on: frappe-arc
    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Upload coverage data
        uses: codecov/codecov-action@v4
        with:
          name: MariaDB
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
