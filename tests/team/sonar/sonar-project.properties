# SonarQube analysis of the Helpdesk app (backend Python + frontend Vue/TS).
# Run with tests/team/sonar/run_sonar.sh, which passes the server URL and token.
sonar.projectKey=helpdesk
sonar.projectName=Frappe Helpdesk (SE3002 SUT)
sonar.sourceEncoding=UTF-8

# paths are relative to the app root (sonar.projectBaseDir)
sonar.sources=helpdesk,desk/src
sonar.exclusions=\
  **/node_modules/**,\
  helpdesk/public/**,\
  helpdesk/locale/**,\
  **/*.min.js,\
  desk/src/**/*.d.ts,\
  helpdesk/**/test_*.py,\
  helpdesk/tests/**

# tests: the team's suites and the upstream test files inside helpdesk/
sonar.tests=tests/team,helpdesk
sonar.test.inclusions=\
  tests/team/**/*.py,\
  tests/team/**/*.mjs,\
  tests/team/**/*.js,\
  helpdesk/**/test_*.py,\
  helpdesk/tests/**/*.py
sonar.test.exclusions=**/node_modules/**,tests/team/reports/**,tests/team/**/evidence/**

# migration patches run once; they are not behaviour the tests target
sonar.coverage.exclusions=helpdesk/patches/**

sonar.python.version=3.14
# unit-test coverage of the team's business-rule scope (written by run_unit.sh)
sonar.python.coverage.reportPaths=tests/team/reports/unit/coverage.xml
sonar.python.xunit.reportPath=tests/team/reports/unit/junit.xml
