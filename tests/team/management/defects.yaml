# Defect log: the single source for DEFECT_LOG tables, the Pareto chart, the
# GQM figures and the GitHub Issues (tools/defects_report.py, file_issues.sh).
#
# severity: Critical | Major | Minor | Trivial   (effect on users or data)
# priority: P1 fix before release | P2 fix soon | P3 next cycle | P4 backlog
# status:   New | Open | Fixed (verified locally, not merged) | Closed | Reopened | Rejected
# triage:   Fix | Fix (CI demo) | Defer | Accept (won't fix) | Duplicate | Not a defect
# category: the Pareto category (one per defect)
# layer:    backend | frontend | dependency | configuration
# file:     source file holding the root cause, when known (defect density)
# risk:     risk-register IDs this defect materialises
# issue:    GitHub Issue number on the group's fork, filled in when filed
# reopened: number of times a fix failed re-test

- id: DEF-01
  ref: D-01
  title: Auto-closed ticket gets no resolution date
  category: Business rule / data integrity
  severity: Major
  priority: P1
  status: Open
  triage: Fix (CI demo)
  layer: backend
  file: helpdesk/helpdesk/doctype/hd_ticket/hd_ticket.py
  risk: [PR-02, PR-03]
  found_by: API test test_auto_closed_ticket_gets_a_resolution_date_like_any_closed_ticket
  found_on: 2026-11-17
  rca: RCA.md#rca-1
  steps: |
    1. Set HD Settings auto_close_after_days = 7, auto_close_status = Replied.
    2. Agent replies to a ticket and sets it to Replied; the last message is 8 days old.
    3. Run close_tickets_after_n_days().
  expected: Ticket Closed with a resolution date, as when an agent closes it.
  actual: Ticket Closed, status category Resolved, resolution_date empty.
  reopened: 0

- id: DEF-02
  ref: SEC-01 / W-API-05
  title: Customer can assign an agent to their own ticket
  category: Access control
  severity: Major
  priority: P1
  status: Open
  triage: Fix
  layer: backend
  file: helpdesk/helpdesk/doctype/hd_ticket/hd_ticket.py
  risk: [PR-05]
  found_by: API test test_customer_cannot_assign_an_agent; Playwright AC-08
  found_on: 2026-11-17
  rca: RCA.md#rca-2
  steps: |
    1. Sign in as customer.a, raise a ticket.
    2. POST /api/method/run_doc_method with dt=HD Ticket, method=assign_agent, args={"agent": "agent.one@sqe.test"}.
  expected: 403, no assignment.
  actual: 200; agent assigned and notified.
  reopened: 0

- id: DEF-03
  ref: W-API-06
  title: Ticket can be assigned to a customer account, which then reads it
  category: Access control
  severity: Major
  priority: P1
  status: Open
  note: upstream test_non_agent_flow expects assignment to non-agent desk users; the defect is assignment to a portal customer
  triage: Fix
  layer: backend
  file: helpdesk/helpdesk/doctype/hd_ticket/hd_ticket.py
  risk: [PR-05]
  found_by: API test test_ticket_cannot_be_assigned_to_a_non_agent
  found_on: 2026-11-17
  steps: |
    1. As an agent, assign customer A's ticket to customer.b@sqe.test.
    2. Sign in as customer B and open the ticket.
  expected: Assignment refused (not an agent); customer B gets 403.
  actual: 200; the ticket is shared with customer B, who can read it.
  reopened: 0

