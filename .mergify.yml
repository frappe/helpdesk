pull_request_rules:
  - name: Auto-close PRs on stable branch
    conditions:
      - and:
          - author != RitvikSardana
          - author != frappe-pr-bot
          - author != frappe-release-bot[bot]
          - author != mergify[bot]
          - author != aerodeval
      - or:
          - base = main
          - base = version-15
          - base = version-16
    actions:
      close:
      comment:
        message: |
          @{{author}}, thanks for the contribution, but we do not accept pull requests on a stable branch. Please raise PR on develop branch.
  - name: backport to develop
    conditions:
      - label = "backport develop"
    actions:
      backport:
        branches:
          - develop
        assignees:
          - "{{ author }}"
  - name: backport to version-15-hotfix
    conditions:
      - label = "backport version-15-hotfix"
    actions:
      backport:
        branches:
          - version-15-hotfix
        assignees:
          - "{{ author }}"
  - name: backport to version-16-hotfix
    conditions:
      - label = "backport version-16-hotfix"
    actions:
      backport:
        branches:
          - version-16-hotfix
        assignees:
          - "{{ author }}"
  - name: backport to version-15
    conditions:
      - label = "backport version-15"
    actions:
      backport:
        branches:
          - version-15
        assignees:
          - "{{ author }}"
  - name: backport to version-16
    conditions:
      - label = "backport version-16"
    actions:
      backport:
        branches:
          - version-16
        assignees:
          - "{{ author }}"
